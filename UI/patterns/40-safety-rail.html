<!DOCTYPE html>
<html lang="ja" data-particles="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>40 Safety Rail — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* 安全情報レール — 禁忌・属性を推奨より上に常時表示 */
    :root {
      --ui-primary: #b45309;
      --ui-primary-dark: #92400e;
      --ui-primary-soft: #fff7ed;
      --ui-bg-outer: #fffbeb;
      --ui-bg-chat: #fffef7;
      --ui-bg-header: #fff;
      --ui-text: #292524;
      --ui-border: #fde68a;
      --ui-bubble-user-bg: #d97706;
      --focus-color: #b45309;
    }
    .ui-header { border-bottom: 1px solid var(--ui-border); }
    .ui-send { background: #d97706; }
    .ui-card--pro { border-color: #fde68a; }
    .ui-particles { display: none; }
    .ui-dev-badge { background: #b45309; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>
    UIShell.mount('app', {
      theme: 'safety-rail',
      layout: 'safety',
      recoLayout: 'carousel',
      carouselStyle: 'pro'
    });
  </script>
</body>
</html>
