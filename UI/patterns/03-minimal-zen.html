<!DOCTYPE html>
<html lang="ja" data-particles="· · ·">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>03 Minimal Zen — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* 禅・ミニマル — 余白と細線 */
    :root {
      --ui-primary: #37474f;
      --ui-primary-dark: #263238;
      --ui-primary-soft: #eceff1;
      --ui-accent: #546e7a;
      --ui-bg-outer: #fafafa;
      --ui-bg-chat: #ffffff;
      --ui-bg-header: #ffffff;
      --ui-text-on-primary: #263238;
      --ui-border: #e0e0e0;
      --ui-radius-sm: 4px;
      --ui-radius-md: 8px;
      --ui-radius-lg: 12px;
      --ui-shadow: none;
      --ui-bubble-user-bg: #37474f;
    }
    .ui-header { border-bottom: 1px solid var(--ui-border); }
    .ui-lang-btn, .ui-icon-btn { background: var(--ui-primary-soft); color: var(--ui-text); }
    .ui-action-btn { border: 1px solid var(--ui-border); background: #fff; color: var(--ui-text); }
    .ui-action-btn--primary { background: var(--ui-primary); color: #fff; border-color: transparent; }
    .ui-mic, .ui-send { border-radius: 8px; }
    .ui-bubble { border-radius: 12px; }
    .ui-card { box-shadow: none; border-width: 1px; }
    .ui-particles { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>UIShell.mount('app', { theme: 'minimal-zen', recoLayout: 'stack' });</script>
</body>
</html>
