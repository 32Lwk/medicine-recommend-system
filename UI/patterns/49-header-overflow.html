<!DOCTYPE html>
<html lang="ja" data-particles="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>49 Header Overflow — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    :root {
      --ui-primary: #2563eb;
      --ui-primary-dark: #1d4ed8;
      --ui-primary-soft: #dbeafe;
      --ui-bg-outer: #eff6ff;
      --ui-bg-chat: #f8fafc;
      --ui-bg-header: #2563eb;
      --ui-text-on-primary: #fff;
      --ui-bubble-user-bg: #2563eb;
      --focus-color: #2563eb;
    }
    .ui-send { background: var(--ui-primary); }
    .ui-particles { display: none; }
    .ui-dev-badge { background: var(--ui-primary); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>
    UIShell.mount('app', {
      theme: 'header-overflow',
      headerStyle: 'overflow',
      recoLayout: 'carousel',
      carouselStyle: 'pro'
    });
  </script>
</body>
</html>
