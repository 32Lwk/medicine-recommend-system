<!DOCTYPE html>
<html lang="ja" data-particles="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>38 Material You 3 — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* Google Material Design 3 — dynamic color, elevated cards */
    :root {
      --ui-primary: #6750a4;
      --ui-primary-dark: #4f378b;
      --ui-primary-soft: #eaddff;
      --ui-accent: #7d5260;
      --ui-bg-outer: linear-gradient(180deg, #fef7ff 0%, #f3edf7 100%);
      --ui-bg-chat: #f3edf7;
      --ui-bg-surface: #fffbfe;
      --ui-bg-header: #6750a4;
      --ui-text-on-primary: #fff;
      --ui-text: #1c1b1f;
      --ui-text-muted: #49454f;
      --ui-border: #cac4d0;
      --ui-bubble-user-bg: #6750a4;
      --ui-radius-sm: 12px;
      --ui-radius-md: 16px;
      --ui-radius-lg: 28px;
      --focus-color: #6750a4;
    }
    .ui-app {
      border: none;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 12px rgba(103, 80, 164, 0.15);
    }
    .ui-header {
      background: #6750a4;
      border-radius: 28px 28px 0 0;
    }
    .ui-lang-btn, .ui-icon-btn {
      background: rgba(255,255,255,.12);
      border-radius: 50%;
    }
    .ui-action-btn {
      border-radius: 20px;
      background: rgba(255,255,255,.15);
      color: #fff;
    }
    .ui-action-btn--primary {
      background: #eaddff;
      color: #21005d;
    }
    .ui-msg--bot .ui-bubble {
      border: none;
      border-radius: 28px 28px 28px 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.06);
    }
    .ui-msg--user .ui-bubble {
      border-radius: 28px 28px 4px 28px;
      box-shadow: 0 1px 3px rgba(103, 80, 164, 0.3);
    }
    .ui-card--pro {
      border: none;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(103, 80, 164, 0.12);
      background: #fffbfe;
      transition: box-shadow 0.2s;
    }
    .ui-card--pro:hover {
      box-shadow: 0 2px 6px rgba(0,0,0,.1), 0 8px 24px rgba(103, 80, 164, 0.18);
    }
    .ui-med-badge--rank { background: #eaddff; color: #21005d; border: none; border-radius: 8px; }
    .ui-med-badge--otc { background: #ffd8e4; color: #31111d; border: none; border-radius: 8px; }
    .ui-symptom-tag { background: #e8def8; color: #1d192b; border: none; border-radius: 8px; }
    .ui-score-ring__fill {
      background: conic-gradient(#6750a4 calc(var(--ui-score) * 1%), #e7e0ec 0);
    }
    .ui-chip {
      border-radius: 8px;
      background: #e8def8;
      border: none;
      color: #1d192b;
      font-weight: 500;
    }
    .ui-input-bar {
      background: #fffbfe;
      border-top: none;
      padding: 12px 16px;
    }
    .ui-textarea {
      border-radius: 28px;
      border: 1px solid #cac4d0;
      background: #f3edf7;
    }
    .ui-send {
      background: #6750a4;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(103, 80, 164, 0.4);
    }
    .ui-mic {
      background: #e8def8;
      color: #6750a4;
      border-radius: 50%;
    }
    .ui-carousel-arrow {
      border: none;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    .ui-reco-intro {
      background: #e8def8;
      border-radius: 12px;
      padding: 10px 12px;
      color: #1d192b;
    }
    .ui-particles { display: none; }
    .ui-dev-badge { background: #6750a4; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>
    UIShell.mount('app', {
      theme: 'material-you-3',
      recoLayout: 'carousel',
      carouselStyle: 'pro'
    });
  </script>
</body>
</html>
