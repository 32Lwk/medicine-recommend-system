<!DOCTYPE html>
<html lang="ja" data-particles="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>21 Manga Panel — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* 漫画コマ — 吹き出し・太枠パネル */
    :root {
      --ui-primary: #ff4757;
      --ui-primary-dark: #e84118;
      --ui-primary-soft: #fff5f5;
      --ui-accent: #3742fa;
      --ui-bg-outer: #f5f0e6;
      --ui-bg-chat: #fffef8;
      --ui-bg-surface: #fff;
      --ui-bg-header: #2d3436;
      --ui-text-on-primary: #fff;
      --ui-text: #2d3436;
      --ui-border: #2d3436;
      --ui-radius-sm: 4px;
      --ui-radius-md: 8px;
      --ui-font: "Hiragino Kaku Gothic ProN", "M PLUS 1p", sans-serif;
      --ui-carousel-card-width: min(270px, 76vw);
    }
    body {
      background: #f5f0e6;
      background-image: radial-gradient(#ddd 1px, transparent 1px);
      background-size: 12px 12px;
    }
    .ui-app { border: 4px solid #2d3436; }
    .ui-header { border-bottom: 4px solid #2d3436; }
    .ui-brand h1 { font-weight: 900; letter-spacing: 0.05em; }
    .ui-messages { gap: 20px; }
    .ui-msg--bot .ui-bubble {
      border: 3px solid #2d3436;
      border-radius: 20px;
      background: #fff;
      position: relative;
      box-shadow: 4px 4px 0 #2d3436;
      font-weight: 500;
    }
    .ui-msg--bot .ui-bubble::before {
      content: "";
      position: absolute;
      left: -12px;
      bottom: 12px;
      width: 0;
      height: 0;
      border: 10px solid transparent;
      border-right-color: #2d3436;
    }
    .ui-msg--bot .ui-bubble::after {
      content: "";
      position: absolute;
      left: -6px;
      bottom: 14px;
      width: 0;
      height: 0;
      border: 8px solid transparent;
      border-right-color: #fff;
    }
    .ui-msg--user .ui-bubble {
      background: #ffeaa7;
      color: #2d3436;
      border: 3px solid #2d3436;
      border-radius: 20px;
      box-shadow: 4px 4px 0 #2d3436;
      font-weight: 700;
    }
    .ui-msg--user .ui-bubble::after {
      content: "！";
      position: absolute;
      right: -8px;
      top: -8px;
      font-size: 1.2rem;
      font-weight: 900;
    }
    .ui-msg--user { position: relative; }
    .ui-card {
      border: 3px solid #2d3436;
      box-shadow: 6px 6px 0 #2d3436;
      border-radius: 8px;
    }
    .ui-card-hero,
    .ui-med-image--playful {
      background: repeating-linear-gradient(-45deg, #fff, #fff 8px, #ffeaa7 8px, #ffeaa7 16px);
      border-bottom: 3px solid #2d3436;
      height: 90px;
    }
    .ui-card-rank {
      background: var(--ui-primary);
      color: #fff;
      display: inline-block;
      padding: 2px 10px;
      border: 2px solid #2d3436;
      font-weight: 900;
      transform: rotate(-2deg);
    }
    .ui-card-score {
      background: #ffeaa7;
      border: 2px solid #2d3436;
      color: #2d3436;
      font-weight: 900;
    }
    .ui-chip {
      border: 2px solid #2d3436;
      font-weight: 700;
      box-shadow: 2px 2px 0 #2d3436;
    }
    .ui-send {
      background: var(--ui-primary);
      border: 3px solid #2d3436;
      box-shadow: 3px 3px 0 #2d3436;
      font-weight: 900;
    }
    .ui-particles { display: none; }
    .ui-dev-badge { background: var(--ui-primary); border: 2px solid #2d3436; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>UIShell.mount('app', { theme: 'manga-panel', recoLayout: 'carousel', carouselStyle: 'playful' });</script>
</body>
</html>
