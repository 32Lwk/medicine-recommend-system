<!DOCTYPE html>
<html lang="ja" data-particles="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>50 Header Floating — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    :root {
      --ui-primary: #059669;
      --ui-primary-dark: #047857;
      --ui-primary-soft: #d1fae5;
      --ui-bg-outer: #ecfdf5;
      --ui-bg-chat: #f0fdf4;
      --ui-bg-header: rgba(255,255,255,0.9);
      --ui-text: #064e3b;
      --ui-border: #a7f3d0;
      --ui-bubble-user-bg: #059669;
      --focus-color: #059669;
    }
    .ui-app { border: 1px solid var(--ui-border); }
    .ui-send { background: var(--ui-primary); }
    .ui-dev-badge { background: var(--ui-primary); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>
    UIShell.mount('app', {
      theme: 'header-floating',
      headerStyle: 'floating',
      layout: 'recovery',
      recoLayout: 'hero',
      carouselStyle: 'pro'
    });
  </script>
</body>
</html>
