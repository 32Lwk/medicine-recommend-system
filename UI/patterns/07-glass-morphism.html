<!DOCTYPE html>
<html lang="ja" data-particles="✨ · ○">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>07 Glass Morphism — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* グラスモーフィズム — 半透明・ぼかし */
    :root {
      --ui-primary: #6366f1;
      --ui-primary-dark: #4f46e5;
      --ui-primary-soft: rgba(99, 102, 241, 0.15);
      --ui-accent: #a78bfa;
      --ui-bg-outer: linear-gradient(135deg, #667eea 0%, #764ba2 40%, #f093fb 100%);
      --ui-bg-chat: rgba(255, 255, 255, 0.25);
      --ui-bg-surface: rgba(255, 255, 255, 0.72);
      --ui-bg-header: rgba(255, 255, 255, 0.55);
      --ui-text-on-primary: #1e1b4b;
      --ui-text: #1e293b;
      --ui-border: rgba(255, 255, 255, 0.45);
      --ui-glass-blur: 16px;
      --ui-bubble-user-bg: linear-gradient(135deg, #6366f1, #8b5cf6);
      --ui-bubble-user-bg: #6366f1;
      --ui-bubble-bot-bg: rgba(255, 255, 255, 0.85);
    }
    body { background-attachment: fixed; }
    .ui-app {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255,255,255,0.5);
    }
    .ui-header {
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }
    .ui-lang-btn, .ui-icon-btn { background: rgba(255,255,255,0.35); }
    .ui-action-btn { background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); }
    .ui-action-btn--primary { background: rgba(99,102,241,0.85); color: #fff; }
    .ui-card--pro {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
    }
    .ui-trust-strip { background: rgba(255,255,255,0.5); }
    .ui-input-bar { background: rgba(255,255,255,0.55); backdrop-filter: blur(12px); }
    .ui-modal { backdrop-filter: blur(20px); background: rgba(255,255,255,0.92); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>UIShell.mount('app', { theme: 'glass', recoLayout: 'carousel', carouselStyle: 'pro' });</script>
</body>
</html>
