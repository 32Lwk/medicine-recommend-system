<!DOCTYPE html>
<html lang="ja" data-particles="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>27 Drug Facts Label — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* FDA / 薬情風 法定表示レイアウト */
    :root {
      --ui-primary: #000;
      --ui-primary-dark: #000;
      --ui-primary-soft: #f5f5f5;
      --ui-bg-outer: #e5e5e5;
      --ui-bg-chat: #fff;
      --ui-bg-surface: #fff;
      --ui-bg-header: #fff;
      --ui-text-on-primary: #000;
      --ui-text: #000;
      --ui-text-muted: #333;
      --ui-border: #000;
      --ui-radius-sm: 0;
      --ui-radius-md: 0;
      --ui-radius-lg: 2px;
      --ui-font: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
      --ui-font-size: 0.82rem;
      --ui-bubble-user-bg: #000;
    }
    .ui-app { border: 3px solid #000; }
    .ui-header { color: #000; border-bottom: 3px solid #000; }
    .ui-brand h1 {
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .ui-lang-btn, .ui-icon-btn, .ui-action-btn {
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
    }
    .ui-action-btn--primary { background: #000; color: #fff; }
    .ui-msg--user .ui-bubble { background: #000; color: #fff; border-radius: 0; }
    .ui-msg--bot .ui-bubble { border: 2px solid #000; border-radius: 0; }
    .ui-drug-label { border-width: 3px; }
    .ui-drug-label__otc { background: #000; color: #fff; border-color: #000; }
    .ui-alert { border: 2px solid #000 !important; border-radius: 0 !important; }
    .ui-send { background: #000; border-radius: 0; }
    .ui-textarea { border-radius: 0; border: 2px solid #000; }
    .ui-particles { display: none; }
    .ui-dev-badge { background: #000; border-radius: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>
    UIShell.mount('app', {
      theme: 'drug-facts-label',
      recoLayout: 'label',
      carouselStyle: 'pro'
    });
  </script>
</body>
</html>
