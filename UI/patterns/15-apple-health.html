<!DOCTYPE html>
<html lang="ja" data-particles="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>15 Apple Health — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* Apple Health — iOSカード・SF風クリーン */
    :root {
      --ui-primary: #ff2d55;
      --ui-primary-dark: #d70015;
      --ui-primary-soft: #ffeef1;
      --ui-accent: #007aff;
      --ui-bg-outer: #f2f2f7;
      --ui-bg-chat: #f2f2f7;
      --ui-bg-surface: #fff;
      --ui-bg-header: #fff;
      --ui-text-on-primary: #111;
      --ui-text: #1c1c1e;
      --ui-text-muted: #8e8e93;
      --ui-border: #e5e5ea;
      --ui-radius-sm: 10px;
      --ui-radius-md: 14px;
      --ui-radius-lg: 18px;
      --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
      --ui-carousel-card-width: min(300px, 80vw);
    }
    .ui-header {
      color: #111;
      border-bottom: 0.5px solid var(--ui-border);
      box-shadow: none;
    }
    .ui-brand h1 { font-size: 1.05rem; font-weight: 600; }
    .ui-brand p { color: var(--ui-text-muted); }
    .ui-lang-btn, .ui-icon-btn { background: #f2f2f7; color: #111; }
    .ui-action-btn { background: #f2f2f7; color: #111; font-weight: 500; }
    .ui-action-btn--primary { background: var(--ui-accent); color: #fff; }
    .ui-msg--user .ui-bubble {
      background: var(--ui-accent);
      color: #fff;
      border-radius: 18px;
    }
    .ui-msg--bot .ui-bubble {
      background: #fff;
      border: none;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .ui-reco-intro {
      background: #fff;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .ui-card {
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      border-radius: 14px;
      overflow: hidden;
    }
    .ui-card-hero,
    .ui-med-image--playful {
      background: linear-gradient(135deg, #ff2d55, #ff6482);
      color: #fff;
      height: 80px;
      font-size: 1.8rem;
    }
    .ui-card-rank { color: var(--ui-primary); font-weight: 600; }
    .ui-card-score {
      background: var(--ui-primary-soft);
      color: var(--ui-primary);
      font-weight: 600;
    }
    .ui-score-grid, .ui-alert {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      border: none;
    }
    .ui-score-chip { background: #f2f2f7; border-radius: 8px; }
    .ui-feedback { background: #fff; border: none; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-radius: 14px; }
    .ui-send { background: var(--ui-accent); }
    .ui-mic { background: #f2f2f7; color: var(--ui-accent); }
    .ui-textarea { background: #f2f2f7; border: none; border-radius: 20px; }
    .ui-input-bar { background: #fff; border-top: 0.5px solid var(--ui-border); }
    .ui-particles { display: none; }
    .ui-dev-badge { background: var(--ui-primary); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>UIShell.mount('app', { theme: 'apple-health', recoLayout: 'carousel' });</script>
</body>
</html>
