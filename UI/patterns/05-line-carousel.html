<!DOCTYPE html>
<html lang="ja" data-particles="✨ ·">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>05 LINE Carousel — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* LINE Flex カルーセル準拠 — 横スワイプ + プロカード */
    :root {
      --ui-primary: #06c755;
      --ui-primary-dark: #05a847;
      --ui-primary-soft: #e8f9ee;
      --ui-accent: #06c755;
      --ui-bg-outer: #eef0f2;
      --ui-bg-chat: #849ebf;
      --ui-bg-header: #ffffff;
      --ui-text-on-primary: #111;
      --ui-text: #111;
      --ui-border: #e5e5e5;
      --ui-carousel-card-width: min(85vw, 320px);
      --ui-radius-md: 12px;
      --focus-color: #06c755;
    }
    .ui-header {
      background: #fff;
      color: #111;
      border-bottom: 1px solid #eee;
      box-shadow: 0 1px 0 rgba(0,0,0,.06);
    }
    .ui-lang-btn, .ui-icon-btn { background: #f5f5f5; color: #333; }
    .ui-brand h1 { font-size: 1rem; color: #06c755; }
    .ui-brand p { color: #888; }
    .ui-action-btn { background: #f0f0f0; color: #333; }
    .ui-action-btn--primary { background: #06c755; color: #fff; }
    .ui-action-btn--warn { background: #fff3cd; }
    .ui-msg--user .ui-bubble {
      background: #8de055;
      color: #111;
      border-bottom-right-radius: 4px;
    }
    .ui-msg--bot .ui-bubble { max-width: 96%; border: none; padding: 0; background: transparent; }
    .ui-reco-intro {
      background: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .ui-card--pro {
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .ui-med-badge--rank { color: #06c755; }
    .ui-score-ring__value { color: #05a847; }
    .ui-carousel-region { margin: 0 -8px; }
    .ui-send { background: #06c755; }
    .ui-mic { background: #e8f9ee; color: #05a847; }
    .ui-score-grid, .ui-alert {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      margin-top: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .ui-feedback { background: #fff; border: none; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .ui-dev-badge { background: #06c755; }
    .ui-symptom-tag { background: #e8f9ee; color: #05a847; border-color: #b8e6c8; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>
    UIShell.mount('app', {
      theme: 'line-carousel',
      recoLayout: 'carousel',
      carouselStyle: 'pro'
    });
  </script>
</body>
</html>
