<!DOCTYPE html>
<html lang="ja" data-particles="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>41 Explainable Path — 医薬品チャット UI</title>
  <link rel="icon" href="../../static/favicon.ico.png" type="image/png">
  <link rel="stylesheet" href="../shared/shell.css">
  <style>
    /* 説明可能な推奨 — ルールベースの判断過程を可視化 */
    :root {
      --ui-primary: #4f46e5;
      --ui-primary-dark: #3730a3;
      --ui-primary-soft: #e0e7ff;
      --ui-bg-outer: #eef2ff;
      --ui-bg-chat: #fafaff;
      --ui-bg-header: #4f46e5;
      --ui-text-on-primary: #fff;
      --ui-text: #1e1b4b;
      --ui-border: #c7d2fe;
      --ui-bubble-user-bg: #4f46e5;
      --focus-color: #4f46e5;
    }
    .ui-send { background: var(--ui-primary); }
    .ui-particles { display: none; }
    .ui-dev-badge { background: var(--ui-primary); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/shell.js"></script>
  <script>
    UIShell.mount('app', {
      theme: 'explainable-path',
      layout: 'explain',
      recoLayout: 'hero',
      carouselStyle: 'pro'
    });
  </script>
</body>
</html>
