# AWS CodeBuild — GitHub main push → ECR push → ECS Express redeploy
# Requires: privilegedMode (Docker), IAM role with ECR + ECS permissions
version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "620992446973"
    AWS_DEFAULT_REGION: "ap-northeast-1"
    IMAGE_REPO_NAME: "medicine-recommend"
    ECS_CLUSTER: "default"
    ECS_SERVICE: "medicine-recommend"
    SYNC_STATIC_TO_S3: "true"
    AWS_STAGING_URL: "https://aws.medicine.yutok.dev"
    # SYNC_KB_TO_S3 / KB_INGESTION_ON_PUSH — CodeBuild プロジェクト env で設定（buildspec 内だと console を上書きするためここでは定義しない）
    RUN_KB_EVAL: "false"
    KB_EVAL_STRICT: "false"
    RUN_LOCAL_RAG_EVAL: "false"
    LOCAL_RAG_EVAL_STRICT: "false"
    RUN_LOCAL_RAG_E2E_HTTP: "false"
    SMOKE_STRICT: "false"

phases:
  pre_build:
    commands:
      - echo "==> ECR login"
      - IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}"
      - aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION" || aws ecr create-repository --repository-name "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export GIT_COMMIT="${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}"
      - export GIT_COMMIT_DATE="$(date -u +%Y-%m-%d)"
      - echo "GIT_COMMIT=${GIT_COMMIT}"
      - python3 scripts/write_build_meta.py
      - echo "build-meta:" && cat static/build-meta.json
      - echo "==> pull cache image (ignore if missing)"
      - docker pull "${IMAGE_URI}:latest" || true
  build:
    commands:
      - echo "==> docker build linux/amd64 (BuildKit + cache-from)"
      - export DOCKER_BUILDKIT=1
      - |
        docker build --platform linux/amd64 \
          --cache-from "${IMAGE_URI}:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg "GIT_COMMIT=${GIT_COMMIT}" \
          --build-arg "COMMIT_SHA=${GIT_COMMIT}" \
          --build-arg "GIT_COMMIT_DATE=${GIT_COMMIT_DATE}" \
          -t "${IMAGE_URI}:latest" .
      - docker push "${IMAGE_URI}:latest"
  post_build:
    commands:
      - echo "==> post_deploy (fast path — full verification preserved)"
      - bash scripts/codebuild-post-deploy.sh

cache:
  paths:
    - "/root/.cache/pip/**/*"
