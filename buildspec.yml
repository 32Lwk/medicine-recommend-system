# AWS CodeBuild — GitHub main push → ECR push → ECS Express redeploy
# Requires: privilegedMode (Docker), IAM role with ECR + ECS permissions
version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "290780119994"
    AWS_DEFAULT_REGION: "ap-northeast-1"
    IMAGE_REPO_NAME: "medicine-recommend"
    ECS_CLUSTER: "default"
    ECS_SERVICE: "medicine-recommend"
    SYNC_STATIC_TO_S3: "true"
    AWS_STAGING_URL: "https://aws.medicine.yutok.dev"

phases:
  pre_build:
    commands:
      - echo "==> ECR login"
      - IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}"
      - aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION" || aws ecr create-repository --repository-name "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export GIT_COMMIT="${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}"
      - export GIT_COMMIT_DATE="$(date -u +%Y-%m-%d)"
      - echo "GIT_COMMIT=${GIT_COMMIT}"
      - echo "==> pull cache image (ignore if missing)"
      - docker pull "${IMAGE_URI}:latest" || true
  build:
    commands:
      - echo "==> docker build linux/amd64 (BuildKit + cache-from)"
      - export DOCKER_BUILDKIT=1
      - |
        docker build --platform linux/amd64 \
          --cache-from "${IMAGE_URI}:latest" \
          --build-arg "GIT_COMMIT=${GIT_COMMIT}" \
          --build-arg "GIT_COMMIT_DATE=${GIT_COMMIT_DATE}" \
          -t "${IMAGE_URI}:latest" .
      - docker push "${IMAGE_URI}:latest"
  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" -ne 1 ]; then
          echo "Build failed — skip ECS deploy"
          exit 1
        fi
      - echo "==> ECS force redeploy ${ECS_CLUSTER}/${ECS_SERVICE}"
      - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --region "$AWS_DEFAULT_REGION" --query 'service.serviceName' --output text
      - echo "==> wait for ECS service stable"
      - aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_DEFAULT_REGION"
      - |
        if [ "${SYNC_STATIC_TO_S3:-false}" = "true" ]; then
          echo "==> sync static/ to S3 (CloudFront origin)"
          bash scripts/sync-static-to-s3.sh --invalidate
        fi
      - echo "==> Concierge SSOT verify"
      - bash scripts/verify-concierge-ssot.sh
      - echo "==> AWS staging smoke (Translate / Polly / CDN / Concierge)"
      - |
        smoke_ok=0
        if [ "${RUN_CONCIERGE_FAQ_CONTRACT:-false}" = "true" ]; then
          export RUN_CONCIERGE_FAQ_CONTRACT=true
          bash scripts/concierge-staging-smoke.sh && smoke_ok=1 || smoke_ok=0
        else
          bash scripts/aws-staging-smoke.sh && smoke_ok=1 || smoke_ok=0
        fi
        if [ "$smoke_ok" -eq 1 ]; then
          echo "AWS staging smoke passed"
        else
          echo "WARN: AWS staging smoke failed (ECS deploy and static sync already applied)."
          echo "      Typical cause: ECS taskRole lacks translate/polly — run scripts/setup-aws-ecs-task-role.sh (admin IAM)."
          if [ "${SMOKE_STRICT:-false}" = "true" ]; then
            exit 1
          fi
        fi
      - echo "Done. ${AWS_STAGING_URL:-https://aws.medicine.yutok.dev}/health"

cache:
  paths:
    - "/root/.cache/pip/**/*"
