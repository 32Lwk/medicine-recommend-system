# holdout_id: r17-holdout-v1
# Independent paraphrase holdout for overnight R17.
# Labels are provisional and require Evaluator confirmation before any gate use.
version: 1
updated: "2026-09-23"
holdout_id: r17-holdout-v1
label_status_default: provisional_evaluator_confirmation
description: >
  Independent holdout fixture for Jev intent routing evaluation. This set is a
  fresh paraphrase population and is not a reshuffle of
  tests/fixtures/jev_intent_router_eval_10.yaml.
note: >
  Gold labels below are provisional for Evaluator confirmation. High-risk,
  policy-boundary, and session-operations cases carry explicit gate-membership
  expectations so they are not accidentally treated as accuracy-gate eligible.

scenarios:
  - id: r17-holdout-physical-headache-office
    channel: web
    input: こめかみが重くて仕事に集中できません。ドラッグストアで買える頭痛向けの薬はありますか？
    expect:
      primary_route: Physical
      accept_sub_routes: [rule_based_recommend]
      high_risk: []
      accuracy_gate_eligible: true
      membership: eligible
      eligibility_reason: intent_classification_candidate
      required_safety_action_status: undefined_not_scored
      label_confidence: high
      medical_review_needed: false
      review_note: 症状ベースの OTC 推奨相談。Q&A より推奨優先の想定。

  - id: r17-holdout-physical-fever-chills
    channel: web
    input: 昨夜から38度台の熱と寒気があります。受診前に使える市販の解熱薬候補を知りたいです。
    expect:
      primary_route: Physical
      accept_sub_routes: [fever_flow, rule_based_recommend]
      high_risk: []
      accuracy_gate_eligible: true
      membership: eligible
      eligibility_reason: intent_classification_candidate
      required_safety_action_status: undefined_not_scored
      label_confidence: high
      medical_review_needed: false
      review_note: 発熱フロー優先だが OTC 候補案内も許容。

  - id: r17-holdout-medicine-sideeffect-eve
    channel: web
    input: EVEって飲むとぼーっとしたり眠気が出たりしますか？
    expect:
      primary_route: Physical
      accept_sub_routes: [medicine_side_effect_qa, medicine_qa]
      high_risk: []
      accuracy_gate_eligible: true
      membership: eligible
      eligibility_reason: intent_classification_candidate
      required_safety_action_status: undefined_not_scored
      label_confidence: high
      medical_review_needed: false
      review_note: 副作用中心の医薬品 Q&A。単純な症状推奨ではない。

  - id: r17-holdout-store-locator-open-now
    channel: web
    input: 今まだ開いている近場のドラッグストアを知りたいです。営業時間も分かると助かります。
    expect:
      primary_route: Store
      accept_sub_routes: [store_locator]
      high_risk: []
      accuracy_gate_eligible: true
      membership: eligible
      eligibility_reason: intent_classification_candidate
      required_safety_action_status: undefined_not_scored
      label_confidence: high
      medical_review_needed: false
      review_note: 症状なしの店舗案内。Store 単独の paraphrase。

  - id: r17-holdout-counseling-insomnia-rumination
    channel: web
    input: 考えごとで夜に目がさえてしまって、ここ数日ちゃんと眠れていません。少し話を聞いてほしいです。
    expect:
      primary_route: Counseling
      accept_sub_routes: [emotional_support]
      high_risk: []
      accuracy_gate_eligible: true
      membership: eligible
      eligibility_reason: intent_classification_candidate
      required_safety_action_status: undefined_not_scored
      label_confidence: medium
      medical_review_needed: false
      review_note: 非危機の不眠・情緒支援。希死念慮や自傷表現は含めない。

  - id: r17-holdout-otc-compare-bufferin-tylenol
    channel: web
    input: バファリンとタイレノールって、熱や頭痛に使うなら何が違いますか？
    expect:
