- id: ctx-abdominal-timeout-01
  category: physical_context
  wave: regression
  input: お腹が痛い
  description: 腹痛推奨が120秒以内に返る（KB citation タイムアウト回帰）
  expect:
    primary_route: Physical
    must_have_response: true
    must_not:
    - response_missing

- id: ctx-loxonin-followup-home-01
  category: medicine_thread
  wave: regression
  input: 家にもあります
  setup:
  - ロキソニンの写真を見せてください
  description: ロキソニン画像QA後の「家にもあります」は greeting ではなく医薬品フォロー
  expect:
    primary_route: Physical
    must_have_response: true
    min_turns: 2
    must_not:
    - greeting_only
    must_not_contain:
    - お話しできて良かった
    context_keywords:
    - ロキソニン

- id: ctx-loxonin-followup-s-variant-01
  category: medicine_thread
  wave: regression
  input: Sはついていません
  setup:
  - ロキソニンの写真を見せてください
  - 家にもあります
  description: 製剤Sの有無確認は医薬品スレッド継続（会話終了テンプレ禁止）
  expect:
    primary_route: Physical
    must_have_response: true
    min_turns: 3
    must_not:
    - greeting_only
    must_not_contain:
    - お話しできて良かった
    context_keywords:
    - ロキソニン

- id: ctx-loxonin-followup-s-found-01
  category: medicine_thread
  wave: regression
  input: 見てみたらSがついていました
  setup:
  - ロキソニンの写真を見せてください
  - 家にもあります
  - Sはついていません
  description: S表記の訂正報告もロキソニン文脈を維持（azのど等への誤参照禁止）
  expect:
    primary_route: Physical
    must_have_response: true
    min_turns: 4
    must_not:
    - greeting_only
    must_not_contain:
    - お話しできて良かった
    - azのど
    context_keywords:
    - ロキソニン

