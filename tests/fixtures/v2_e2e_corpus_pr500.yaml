- id: corpus-medicine-0006
  category: medicine_thread
  wave: log-corpus
  input: ありがとうございます。のどスプレーは使いやすそうですね。イブスリーショットプレミアムは眠気が心配ですが、痛みが強い場合は考えます。
  description: counseling_detail turn 4
  expect:
    must_have_response: true
    min_turns: 4
    must_not:
    - greeting_only
  setup:
  - 大会前なので、慎重に対策したいです。のどスプレーを使って、様子を見てみます。痛みが強ければイブも考えます。
  - イブプロフェンは痛みを抑える効果がありますが、眠気が出る場合もあるので、大会前は注意が必要です。
  - けると良いでしょう。大会に向けて体調管理が大切ですね。何か他に気になることはありますか？
