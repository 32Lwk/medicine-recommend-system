  - id: edy2-age-baby
    style: casual
    query: "赤ちゃんに使える解熱剤ある？"
    expect_focuses: ["age"]
    expect_information_question: true

  - id: edy2-dop-track-meet
    style: english_mix
    query: "明日track meetあるんだけどイブOK？"
    expect_focuses: ["doping"]
