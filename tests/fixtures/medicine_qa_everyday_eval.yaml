    expect_focuses: ["comparison"]
    expect_information_question: true

  - id: edy2-ctx-dop-race
    style: context
    description: "大会文脈後のドーピング"
    history:
    - role: user
      content: "週末に駅伝あります"
    - role: assistant
      content: "カロナールAをご検討ください"
    - role: user
      content: "それ大会前に使って大丈夫？"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["doping"]
    expect_information_question: true

  - id: edy2-ctx-ix-drink
    style: context
    description: "推奨後の酒との併用"
    history:
    - role: user
      content: "歯が痛いです"
    - role: assistant
      content: "ロキソニンをお試しください"
    - role: user
      content: "今夜飲み会あるんだけど一緒にヤバい？"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["interaction"]
    expect_information_question: true

  - id: edy2-ctx-photo-enmix
    style: context
    description: "英語混じりでパッケージ要求"
    history:
    - role: user
