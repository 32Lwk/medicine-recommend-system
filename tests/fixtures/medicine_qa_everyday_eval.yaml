    expect_information_question: true

  - id: edy2-ix-same-day
    style: polite
    query: "風邪薬とイブを同日に飲んでも大丈夫でしょうか。"
    expect_focuses: ["interaction"]
    expect_information_question: true

  - id: edy2-ix-warfarin-no-cmp
    style: dialect
    query: "ワルファリン飲んでるねんけどロキソ平気？"
    expect_focuses: ["interaction"]
    expect_not_focuses: ["comparison"]
    expect_information_question: true

  - id: edy2-photo-appearance
    style: casual
    query: "見た目どんな感じ"
    recommended_medicines: ["イブ"]
    expect_focuses: ["product_image"]
    expect_information_question: true

  - id: edy2-photo-typo
    style: typo
    query: "バファの見た目見せてくれ"
    recommended_medicines: ["バファリンA"]
    expect_focuses: ["product_image"]
    expect_information_question: true

  - id: edy2-clarify-vague-this
    style: anaphora
    query: "これってどうなん？"
    expect_clarify: true

  - id: edy2-clarify-sns-that
    style: sns
    query: "さっきのやつ大丈夫？"
    expect_clarify: true

  - id: edy2-mixed-photo-ing
    style: mixed
    query: "イブの成分と箱の写真どっちも見たい"
    recommended_medicines: ["イブ"]
    expect_focuses: ["ingredient", "product_image"]
    expect_unified_route: true
    expect_information_question: true

  - id: edy2-mixed-us-se
    style: mixed
    query: "ロキソの飲み方教えて。副作用も気になる"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["usage", "side_effect"]
    expect_unified_route: true
    expect_information_question: true

  - id: edy2-anaphora-us-reco
    style: anaphora
    query: "それ何時間おきに飲めばいいの"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["usage"]
    expect_information_question: true
    expect_clarify: false

  # --- wave3: ソフト言い回し（キーワード非依存・文脈/LLM向け） ---
  - id: edy3-soft-se-after
    style: soft
    query: "それ飲んだあと、なんかぼーっとしてきて心配"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["side_effect"]
    expect_unified_route: false

  - id: edy3-soft-us-timing
    style: soft
    query: "タイミング的にはご飯といっしょがいいのかな"
    recommended_medicines: ["イブ"]
    expect_focuses: ["usage"]
    expect_information_question: true

  - id: edy3-soft-ix-drink
    style: soft
    query: "今晚ちょっとお付き合いがあるんだけど、先に飲んでも平気？"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["interaction"]
    expect_information_question: true

  - id: edy3-soft-age
    style: soft
    query: "うちのちびっ子でもいけるやつ？"
    expect_focuses: ["age"]
    expect_information_question: true
    conversation_history:
      - role: user
        content: "幼稚園児なんです"
      - role: assistant
        content: "症状は？"

  - id: edy3-soft-photo
    style: soft
    query: "店頭で見分けたいから見た目だけ知りたい"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["product_image"]
    expect_information_question: true

  - id: edy3-soft-cmp
    style: soft
    query: "結局どっち寄りのほうが自分向き？"
    recommended_medicines: ["ロキソニン", "イブ"]
    expect_focuses: ["comparison"]
    expect_information_question: true

  - id: edy3-soft-age-otc-follow
    style: soft
    description: "幼稚園文脈のあと、年齢を繰り返さず市販可否を聞く"
    query: "熱に市販薬でいい？"
    conversation_history:
      - role: user
        content: "幼稚園の子どもが熱っぽいです"
      - role: assistant
        content: "症状を教えてください"
    expect_focuses: ["age"]
    expect_information_question: true

  - id: edy3-soft-age-ok-short
    style: soft
    description: "保育園文脈 + 短い可否"
    query: "市販薬使っても大丈夫？"
    conversation_history:
      - role: user
        content: "保育園の息子がぐったりしてます"
      - role: assistant
        content: "熱はありますか"
    expect_focuses: ["age"]
    expect_information_question: true

sessions:
  - id: edy-ctx-anaphora-usage
    style: context
    description: "推奨後の用法 follow-up（指示語）"
    history:
      - role: user
        content: "頭痛がします"
      - role: assistant
        content: "ロキソニンをご検討ください"
      - role: user
        content: "それ、食後の方がいい？"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["usage"]
    expect_information_question: true
    expect_clarify: false

  - id: edy-ctx-anaphora-side
    style: context
    description: "推奨後の副作用 follow-up"
    history:
      - role: user
        content: "肩こりがつらい"
      - role: assistant
        content: "ロキソニンが候補です"
      - role: user
        content: "これ飲むとだるくなる？"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["side_effect"]
    expect_unified_route: false

  - id: edy-ctx-age-followup
    style: context
    description: "年齢共有後の市販可否"
    history:
      - role: user
        content: "息子が小学2年です"
      - role: assistant
        content: "症状を教えてください"
      - role: user
        content: "風邪薬OTCで平気？"
    expect_focuses: ["age"]
    expect_information_question: true

  - id: edy-ctx-cmp-anaphora
    style: context
    description: "2剤言及後の比較"
    history:
      - role: user
        content: "ロキソニンとイブ、どっちがいいか迷ってます"
      - role: assistant
        content: "それぞれ特徴があります"
      - role: user
        content: "結局どっち？"
    expect_focuses: ["comparison"]
    expect_information_question: true

  - id: edy-ctx-clarify-only
    style: context
    description: "履歴なし指示語のみ"
    history:
      - role: user
        content: "この薬の成分教えて"
    expect_clarify: true

  - id: edy-ctx-photo-reco
    style: context
    description: "推奨後の写真"
    history:
      - role: user
        content: "頭痛です"
      - role: assistant
        content: "カロナールAを推奨します"
      - role: user
        content: "パッケージ見たい"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["product_image"]
    expect_information_question: true

  - id: edy-ctx-usage-frequency
    style: context
    description: "推奨後の服用頻度 follow-up"
    history:
      - role: user
        content: "熱が38度です"
      - role: assistant
        content: "カロナールAをお試しください"
      - role: user
        content: "それ、どのくらいの頻度で飲めばいい？"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["usage"]
    expect_information_question: true
    expect_clarify: false

  - id: edy-ctx-dop-followup
    style: context
    description: "推奨後のドーピング確認"
    history:
      - role: user
        content: "来週マラソンがあります"
      - role: assistant
        content: "ロキソニンを推奨します"
      - role: user
        content: "それ使っていい？"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["doping"]
    expect_information_question: true

  - id: edy-ctx-ing-anaphora
    style: context
    description: "推奨後の成分 follow-up"
    history:
      - role: user
        content: "頭痛が続きます"
      - role: assistant
        content: "バファリンAをご検討ください"
      - role: user
        content: "これ何入ってる？"
    recommended_medicines: ["バファリンA"]
    expect_focuses: ["ingredient"]
    expect_information_question: true
    expect_clarify: false

  - id: edy-ctx-ix-alcohol
    style: context
    description: "推奨後のアルコール併用"
    history:
      - role: user
        content: "肩こりがひどい"
      - role: assistant
        content: "ロキソニンを推奨します"
      - role: user
        content: "ワイン飲んでるけど平気？"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["interaction"]
    expect_information_question: true

  - id: edy-ctx-anaphora-side-no-cmp
    style: context
    description: "比較履歴後の指示語副作用（比較誤検出なし）"
    history:
      - role: user
        content: "イブとロキソどっちがいい？"
      - role: assistant
        content: "ロキソニンを推奨します"
      - role: user
        content: "じゃあロキソで"
      - role: assistant
        content: "承知しました"
      - role: user
        content: "2つ前に言ったやつ、副作用ヤバい？"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["side_effect"]
    expect_unified_route: false
    expect_not_focuses: ["comparison"]

  - id: edy-ctx-efficacy-reco
    style: context
    description: "推奨後の効き目+副作用"
    history:
      - role: user
        content: "頭痛です"
      - role: assistant
        content: "ロキソニンをお試しください"
      - role: user
        content: "効き目どう？副作用気になる"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["side_effect"]
    expect_information_question: true
    expect_unified_route: true

  - id: edy2-ctx-sns-side
    style: context
    description: "推奨後のSNS風・副作用確認"
    history:
    - role: user
      content: "頭がガンガンする"
    - role: assistant
      content: "ロキソニンをご検討ください"
    - role: user
      content: "それ飲むとガチ眠くなんない？"
