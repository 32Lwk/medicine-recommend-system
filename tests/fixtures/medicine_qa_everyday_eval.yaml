# Medicine QA ロバストネス eval — 日常表現・口語・省略・文脈 follow-up
# routing（focus / clarify / unified）+ 任意 retrieve を検証

scenarios:
  # --- カジュアル・口語（単発） ---
  - id: edy-se-slang-sleepy
    style: casual
    query: "ロキソ飲んだらガチ眠いんだけど普通？"
    expect_focuses: ["side_effect"]
    expect_unified_route: false
    expect_side_effect_route: true

  - id: edy-se-dialect-stomach
    style: dialect
    query: "イブ飲んで腹パンするわ、しゃーない？"
    expect_focuses: ["side_effect"]
    expect_unified_route: false

  - id: edy-cmp-casual
    style: casual
    query: "ロキソとイブ、何が違うの？"
    recommended_medicines: ["ロキソニン", "イブ"]
    expect_focuses: ["comparison"]
    expect_information_question: true

  - id: edy-photo-casual
    style: casual
    query: "カロナールの箱見たい"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["product_image"]
    expect_information_question: true

  - id: edy-ing-casual
    style: casual
    query: "バファリン何入ってる？"
    expect_focuses: ["ingredient"]
    expect_information_question: true

  - id: edy-age-casual
    style: casual
    query: "小5でもイブ飲める？"
    expect_focuses: ["age"]
    expect_information_question: true

  - id: edy-dop-casual
    style: casual
    query: "マラソン前にロキソ使っていい？"
    expect_focuses: ["doping"]
    expect_information_question: true

  - id: edy-ix-casual
    style: casual
    query: "ロキソとワルファ一緒に飲んだらヤバ？"
    expect_focuses: ["interaction"]
    expect_information_question: true

  - id: edy-us-casual
    style: casual
    query: "解熱剤何時間空ければいい？"
    expect_focuses: ["usage"]
    expect_information_question: true

  - id: edy-clarify-anaphora
    style: anaphora
    query: "それ飲んで大丈夫？"
    expect_clarify: true

  - id: edy-mixed-photo-side
    style: mixed
    query: "ロキソの副作用とパッケージ見せて"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["product_image", "side_effect"]
    expect_unified_route: true
    expect_information_question: true

  - id: edy-pick-casual
    style: casual
    query: "ロキソとイブどっちがええ？"
    recommended_medicines: ["ロキソニン", "イブ"]
    expect_focuses: ["comparison"]
    expect_information_question: true

  # --- 敬語・丁寧（単発） ---
  - id: edy-se-polite
    style: polite
    query: "ロキソプロフェンで眠気が出るのは一般的でしょうか。"
    expect_focuses: ["side_effect"]
    expect_unified_route: false

  - id: edy-ing-polite
    style: polite
    query: "カロナールの主成分を教えていただけますか。"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["ingredient"]
    expect_information_question: true

  # --- 英語混じり ---
  - id: edy-photo-enmix
    style: english_mix
    query: "Loxonin package photo見せて"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["product_image"]

  - id: edy-se-enmix
    style: english_mix
    query: "ibuprofenでsleepyになるのnormal？"
    expect_focuses: ["side_effect"]

  - id: edy-us-frequency-casual
    style: casual
    query: "カロナール1日何回まで飲める？"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["usage"]
    expect_information_question: true

  - id: edy-se-kansai
    style: dialect
    query: "ロキソ飲んだらめっちゃ眠くなるけどええん？"
    expect_focuses: ["side_effect"]
    expect_unified_route: false

  - id: edy-ing-shorthand
    style: casual
    query: "イブの中身なに？"
    expect_focuses: ["ingredient"]
    expect_information_question: true

  - id: edy-age-vague
    style: casual
    query: "未就学児でも市販の風邪薬使える？"
    expect_focuses: ["age"]
    expect_information_question: true

  - id: edy-dop-casual2
    style: casual
    query: "大会2日前にロキソ平気？"
    expect_focuses: ["doping"]
    expect_information_question: true

  - id: edy-ix-shorthand
    style: casual
    query: "ロキソとアスピン同時に飲んどったらアカン？"
    expect_focuses: ["interaction"]
    expect_information_question: true

  - id: edy-cmp-vague
    style: casual
    query: "解熱剤2つ並べてどっちがマシ？"
    recommended_medicines: ["ロキソニン", "カロナールA"]
    expect_focuses: ["comparison"]
    expect_information_question: true

  - id: edy-photo-shorthand
    style: casual
    query: "さっきの薬の外観見たいんだけど"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["product_image"]
    expect_information_question: true

  - id: edy-se-normalcy
    style: casual
    query: "イブ飲んで胃キツくなるの普通？"
    expect_focuses: ["side_effect"]
    expect_unified_route: false

  - id: edy-us-meal
    style: casual
    query: "バファリン食前でもOK？"
    expect_focuses: ["usage"]
    expect_information_question: true

  - id: edy-clarify-vague
    style: anaphora
    query: "あれ副作用ある？"
    expect_clarify: true

  - id: edy-ix-alcohol-casual
    style: casual
    query: "ロキソ飲んでからビール平気？"
    expect_focuses: ["interaction"]
    expect_information_question: true

  - id: edy-se-efficacy-mixed
    style: mixed
    query: "効き目どう？副作用も気になる"
    recommended_medicines: ["ロキソニン"]
    expect_focuses: ["side_effect"]
    expect_information_question: true
    expect_unified_route: true

  - id: edy-age-child-vague
    style: casual
    query: "あのさ、子供用のやつ飲んでも大丈夫？"
    expect_focuses: ["age"]
    expect_information_question: true

  - id: edy-us-tablets-anaphora
    style: anaphora
    query: "何錠飲めばいいのこれ"
    recommended_medicines: ["カロナールA"]
    expect_focuses: ["usage"]
    expect_information_question: true
    expect_clarify: false

# --- wave2: 口語・方言・英語混じり・症状クラス・年齢ライフステージ ---
  - id: edy2-se-sns-drowsy
