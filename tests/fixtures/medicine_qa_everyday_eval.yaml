  - id: edy2-ing-active-en
    style: english_mix
    query: "ロキソのactive ingredient教えて"
    expect_focuses: ["ingredient"]
    expect_information_question: true

  - id: edy2-ing-typo-aspirin
    style: typo
    query: "アスピンって成分なに？"
    expect_focuses: ["ingredient"]
