version: 1
updated: "2026-09-23"
description: >
  R11 Phase1 local API smoke — non-high-risk synthetic only (max 5).
  Excludes Emergency/Security/SessionOps/controlled/crisis.

scenarios:
  - id: smoke-physical-headache
    channel: web
    input: 頭痛がします。市販薬でおすすめはありますか？
    expect:
      primary_route: Physical
      accept_sub_routes: [rule_based_recommend]

  - id: smoke-physical-fever
    channel: web
    input: 39度の熱があります
    expect:
      primary_route: Physical
      accept_sub_routes: [fever_flow, rule_based_recommend]

  - id: smoke-medicine-qa
    channel: web
    input: ロキソニンとイブの違いを教えてください
    expect:
      primary_route: Physical
      accept_sub_routes: [medicine_qa]

  - id: smoke-store
    channel: web
    input: 近くの薬局を探したいです
    expect:
      primary_route: Store
      accept_sub_routes: [store_locator]

  - id: smoke-concierge
    channel: web
    input: このアプリの技術スタックを教えて
    expect:
      primary_route: Concierge
      accept_sub_routes: [architecture, app_about]
