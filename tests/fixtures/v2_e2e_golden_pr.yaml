description: PR必須ゴールデン（初期）。expanded から turn_expects 付きで移行。anaphora/pivot 専バケット含む。
scenarios:
- id: golden-loxonin-home-01
  category: anaphora
  wave: golden-pr
  description: ロキソニンスレッド — 家にも（greeting リセット禁止）
  setup:
  - ロキソニンの写真を見せてください
  input: 家にもあります
  turn_expects:
  - turn: 0
    expect:
      must_have_response: true
      context_keywords:
      - ロキソニン
  - turn: 1
    expect:
      must_have_response: true
      must_not:
      - greeting_only
      context_keywords:
      - ロキソニン
      must_reference_prior:
      - ロキソニン
      must_not_repeat_prior_bot: true
  expect:
    min_turns: 2

