    channel: line
    persona: privacy_conscious_parent
    input: 子どもの相談内容が残っているのが怖いので、記録を消したいです。
    expect:
      primary_route: SessionOps
      accept_sub_routes: [delete, delete_confirm]
      high_risk: []
      accuracy_gate_eligible: false
      membership: ineligible
      eligibility_reason: sessionops_fast_path
      label_confidence: high
      review_note: SessionOps retained for membership integrity; not Gate denom.

  - id: r21-persona-elder-sideeffect
    channel: web
    persona: elderly_walker
    input: 病院でもらった痛み止めとは別で、市販の湿布を使うと眠くなることありますか？
    expect:
