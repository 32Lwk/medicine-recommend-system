# Distinct from tests/fixtures/r17_persona_scripts.yaml (offline hard-fail suite).
version: 1
updated: "2026-09-24"
holdout_id: r21-holdout-persona-v1
label_status_default: holdout_provisional
description: >
  Persona-flavored independent holdout utterances for R21. Synthetic-only.
  SessionOps / Emergency remain membership-ineligible where applicable.

scenarios:
  - id: r21-persona-elder-knee-otc
    channel: web
    persona: elderly_walker
    input: 膝が痛くて散歩がつらいんです。薬局で買える痛み止めの候補を教えてもらえますか。
    expect:
      primary_route: Physical
      accept_sub_routes: [rule_based_recommend, medicine_qa]
      high_risk: []
      accuracy_gate_eligible: true
      membership: eligible
      eligibility_reason: intent_classification_candidate
      label_confidence: high
      review_note: Elderly OTC pain consult.

  - id: r21-persona-parent-child-fever
    channel: web
    persona: hurried_parent
    input: 小学生の子どもが熱っぽいみたいです。市販の子どもの解熱について教えてください。
    expect:
      primary_route: Physical
      accept_sub_routes: [fever_flow, rule_based_recommend, medicine_qa]
      high_risk: []
      accuracy_gate_eligible: true
      membership: eligible
      eligibility_reason: intent_classification_candidate
      label_confidence: medium
      review_note: Pediatric fever framing; still OTC intent classification.

  - id: r21-persona-student-store
    channel: web
    persona: impatient_student
    input: 今すぐ近くのドラッグストア行きたい。どこが開いてる？
    expect:
      primary_route: Store
      accept_sub_routes: [store_locator]
      high_risk: []
      accuracy_gate_eligible: true
      membership: eligible
      eligibility_reason: intent_classification_candidate
