name: Chat Pipeline v2 PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"

concurrency:
  group: chat-pipeline-v2-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Scope check
        run: python scripts/check_w1a_scope.py

      - name: Validate PR500 E2E corpus
        run: python scripts/validate_e2e_corpus.py

      - name: Validate golden PR turn_expects
        run: python scripts/validate_turn_expects.py --path tests/fixtures/v2_e2e_golden_pr.yaml

      - name: Pytest (dialogue + routing + corpus + e2e eval)
        run: |
          pytest tests/analysis/test_e2e_corpus_builder.py \
            tests/routing/test_medicine_qa_route_pivot.py \
            tests/services/test_medicine_thread_context.py \
            tests/services/test_e2e_turn_eval.py \
            tests/services/test_e2e_gpt_user_sim.py \
            tests/services/test_reco_followup_signals.py \
            tests/services/test_conversation_followup_resolver.py \
            tests/services/test_dialogue_turn_trace.py \
            tests/scripts/test_validate_turn_expects.py \
            tests/dialogue/ tests/contract/ \
            tests/chat/test_chat_post_pipeline_v2.py \
            tests/handlers/test_chat_post_pipeline_sync.py \
            tests/dialogue/routing/ \
            tests/routing/test_routing_context.py \
            -q --tb=short

  golden-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-golden-live')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medicine_recommend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medicine_recommend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Start app.py
        run: |
          python app.py &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/

      - name: Golden PR live (merge gate subset 20)
        run: |
          python scripts/run_golden_pr_live.py \
            --subset 20 \
            --report-suffix ci-golden-pr-live \
            --judge-on-fail

  pr500-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-pr500-smoke')
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medicine_recommend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medicine_recommend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Start app.py
        run: |
          python app.py &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/

      - name: PR500 smoke (20 scenarios)
        run: |
          python scripts/local_v2_chat_test_runner.py \
            --scenarios-path tests/fixtures/v2_e2e_corpus_pr500.yaml \
            --limit 20 \
            --report-suffix ci-pr500-smoke

  golden-nightly-gpt-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medicine_recommend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medicine_recommend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Start app.py
        run: |
          python app.py &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/

      - name: Nightly GPT user sim (30 personas, diverse everyday)
        run: |
          python scripts/local_v2_chat_test_runner.py \
            --skip-yaml \
            --use-gpt-user \
            --personas-path tests/fixtures/v2_gpt_expanded_personas_30.yaml \
            --sessions 30 \
            --turns-per-session 4 \
            --judge-on-fail \
            --report-suffix nightly-gpt-sim-30
