# Cloud Run 継続的デプロイ用（Git push → ビルド → デプロイ）
# トリガーで「Cloud Build 構成ファイル」に cloudbuild.yaml を指定してください。
#
# 置換変数（トリガー側で上書き可）:
#   _SERVICE_NAME  … Cloud Run サービス名
#   _DEPLOY_REGION … リージョン
#   _AR_REPOSITORY … Artifact Registry リポジトリ名
#
# bash ローカル変数（COMMIT_DATE, IMAGE）は $$ でエスケープ（Cloud Build 置換と衝突防止）

substitutions:
  _SERVICE_NAME: medicine-recommend
  _DEPLOY_REGION: asia-northeast1
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_HOSTNAME: asia-northeast1-docker.pkg.dev

steps:
  - name: python:3.11-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        COMMIT_DATE="$(git log -1 --format=%ci "${COMMIT_SHA}" 2>/dev/null | awk '{print $1}')"
        if [ -z "$${COMMIT_DATE}" ]; then
          COMMIT_DATE="$(date -u +%Y-%m-%d)"
        fi
        export GIT_COMMIT="${COMMIT_SHA}"
        export GIT_COMMIT_DATE="$${COMMIT_DATE}"
        python3 scripts/write_build_meta.py
        echo "build-meta:" && cat static/build-meta.json
        echo "$${COMMIT_DATE}" > /workspace/_commit_date.txt

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        COMMIT_DATE="$(cat /workspace/_commit_date.txt)"
        IMAGE="${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}"
        docker build \
          --build-arg "GIT_COMMIT=${COMMIT_SHA}" \
          --build-arg "GIT_COMMIT_DATE=$${COMMIT_DATE}" \
          -t "$${IMAGE}" \
          .
        docker push "$${IMAGE}"
        echo "$${IMAGE}" > /workspace/_image_ref.txt

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        COMMIT_DATE="$(cat /workspace/_commit_date.txt)"
        IMAGE="$(cat /workspace/_image_ref.txt)"
        # Local RAG BM25 はワーカーあたり ~240MiB。2 workers でも OOM しないよう 1Gi を確保。
        # startup probe は /health（DB/RAG 非依存）。failureThreshold=36 → 最大約 180s。
        gcloud run deploy "${_SERVICE_NAME}" \
          --image="$${IMAGE}" \
          --region="${_DEPLOY_REGION}" \
          --platform=managed \
          --memory=1Gi \
          --cpu=1 \
          --update-env-vars "GIT_COMMIT=${COMMIT_SHA},GIT_COMMIT_DATE=$${COMMIT_DATE},MEDICINE_IMAGE_CDN_BASE=https://images.yutok.dev/otc/" \
          --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=5,failureThreshold=36 \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY
