# Cloud Run 継続的デプロイ用（Git push → ビルド → デプロイ）
# トリガーで「Cloud Build 構成ファイル」に cloudbuild.yaml を指定してください。
#
# 置換変数（トリガー側で上書き可）:
#   _SERVICE_NAME  … Cloud Run サービス名
#   _DEPLOY_REGION … リージョン
#   _AR_REPOSITORY … Artifact Registry リポジトリ名
#
# bash ローカル変数（COMMIT_DATE, IMAGE 等）は $$ でエスケープ（Cloud Build 置換と衝突防止）

substitutions:
  _SERVICE_NAME: medicine-recommend
  _DEPLOY_REGION: asia-northeast1
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_HOSTNAME: asia-northeast1-docker.pkg.dev
  _CACHE_TAG: cache

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        COMMIT_DATE="$(git log -1 --format=%ci "${COMMIT_SHA}" 2>/dev/null | awk '{print $1}')"
        if [ -z "$${COMMIT_DATE}" ]; then
          COMMIT_DATE="$(date -u +%Y-%m-%d)"
        fi
        IMAGE_BASE="${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}"
        IMAGE="$${IMAGE_BASE}:${COMMIT_SHA}"
        CACHE_IMAGE="$${IMAGE_BASE}:${_CACHE_TAG}"
        echo "==> pull cache image (ignore if missing)"
        docker pull "$${CACHE_IMAGE}" || true
        echo "==> docker build (BuildKit + cache-from)"
        export DOCKER_BUILDKIT=1
        docker build \
          --cache-from "$${CACHE_IMAGE}" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg "GIT_COMMIT=${COMMIT_SHA}" \
          --build-arg "COMMIT_SHA=${COMMIT_SHA}" \
          --build-arg "GIT_COMMIT_DATE=$${COMMIT_DATE}" \
          -t "$${IMAGE}" \
          -t "$${CACHE_IMAGE}" \
          .
        docker push "$${IMAGE}"
        docker push "$${CACHE_IMAGE}"
        echo "$${COMMIT_DATE}" > /workspace/_commit_date.txt
        echo "$${IMAGE}" > /workspace/_image_ref.txt

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        COMMIT_DATE="$(cat /workspace/_commit_date.txt)"
        IMAGE="$(cat /workspace/_image_ref.txt)"
        # Local RAG BM25 はワーカーあたり ~240MiB。2 workers でも OOM しないよう 1Gi を確保。
        # startup probe は /health（DB/RAG 非依存）。failureThreshold=36 → 最大約 180s。
        gcloud run deploy "${_SERVICE_NAME}" \
          --image="$${IMAGE}" \
          --region="${_DEPLOY_REGION}" \
          --platform=managed \
          --memory=1Gi \
          --cpu=1 \
          --no-cpu-throttling \
          --update-env-vars "GIT_COMMIT=${COMMIT_SHA},GIT_COMMIT_DATE=$${COMMIT_DATE},MEDICINE_IMAGE_CDN_BASE=https://images.yutok.dev/otc/,CHAT_WORKER_MAX=8,CHAT_STREAM_TIMEOUT_SEC=180,GUNICORN_WORKER_CLASS=uvicorn.workers.UvicornWorker,GUNICORN_WORKERS=2,EXPLAIN_BATCH_HARD_TIMEOUT_SEC=60,MEDICINE_KB_AUGMENT_TIMEOUT_SEC=15,PROCESSING_STATUS_READ_CACHE_SEC=2.5" \
          --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=5,failureThreshold=36 \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY
