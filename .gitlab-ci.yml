# GitLab CI — Chat Pipeline v2 契約テスト + dialogue スイート
# Cloud Build (cloudbuild.yaml) はデプロイ専用。ユニット/契約テストはここで実行。

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

.chat-pipeline-v2-test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --quiet -r requirements.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dialogue-contract-tests:
  extends: .chat-pipeline-v2-test
  script:
    - python scripts/check_w1a_scope.py
    - python scripts/validate_e2e_corpus.py
    - pytest tests/analysis/test_e2e_corpus_builder.py tests/routing/test_medicine_qa_route_pivot.py tests/services/test_medicine_thread_context.py -q --tb=short
    - pytest tests/dialogue/ tests/contract/ tests/chat/test_chat_post_pipeline_v2.py tests/handlers/test_chat_post_pipeline_sync.py tests/analysis/test_intent_router_log_analysis.py tests/dialogue/routing/ tests/handlers/test_nlu_resolve_v2_history.py tests/services/test_line_memory_context_v2.py tests/services/test_chat_response_service_v2.py tests/routing/test_routing_context.py -q --tb=short

local-rag-retrieve-eval:
  extends: .chat-pipeline-v2-test
  variables:
    LOCAL_RAG_MIN_MEDICINE_PCT: "80"
    LOCAL_RAG_MIN_CONCIERGE_PCT: "90"
  script:
    - python scripts/build_medicine_kb_documents.py
    - chmod +x scripts/run_local_rag_eval.sh scripts/concierge-technical-faq-contract.sh
    - RUN_LOCAL_RAG_BENCHMARK=1 bash scripts/run_local_rag_eval.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/services/local_rag*.py
        - src/services/local_rag_*.py
        - src/services/bedrock_kb_retrieve.py
        - src/services/concierge_intent.py
        - src/services/concierge_output_sanitize.py
        - src/services/concierge_tech_synonyms.py
        - src/content/concierge_tech_reference.py
        - src/agents/concierge_agent.py
        - config/local_rag_config.py
        - docs/concierge/**/*
        - docs/public/**/*
        - data/**/*
        - scripts/build_medicine_kb_documents.py
        - scripts/build_local_rag_index.py
        - scripts/eval_concierge_*.py
        - scripts/run_local_rag_eval.sh
        - scripts/concierge-technical-faq-contract.sh
        - scripts/eval_local_rag_e2e.py
        - tests/fixtures/concierge_*.yaml
        - tests/fixtures/medicine_kb_eval.yaml
        - tests/fixtures/local_rag_e2e.yaml
        - tests/services/test_local_rag_router.py
        - tests/concierge/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

concierge-meta-kb-contract:
  extends: .chat-pipeline-v2-test
  script:
    - chmod +x scripts/concierge-technical-faq-contract.sh
    - bash scripts/concierge-technical-faq-contract.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/services/concierge_intent.py
        - src/services/concierge_output_sanitize.py
        - src/content/concierge_tech_reference.py
        - src/agents/concierge_agent.py
        - docs/concierge/**/*
        - tests/fixtures/concierge_*.yaml
        - scripts/eval_concierge_*.py
        - scripts/concierge-technical-faq-contract.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
